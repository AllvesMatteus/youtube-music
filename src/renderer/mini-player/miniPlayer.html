<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mini Player</title>
  <link rel="stylesheet" href="./miniPlayer.css">
</head>
<body>
  <main class="mini-player">

    <header class="window-actions">
      <button id="account-button" class="icon-button" title="Contas">
        <img src="../../../assets/icons/user.svg" alt="Conta">
      </button>
      <button id="close-button" class="icon-button close" title="Fechar">&times;</button>
    </header>

    <div class="top-section">
      <img id="cover" class="cover" alt="Capa" src="../../../assets/icon.png">
      <div class="right-panel">
        <p class="track-title" id="title">Nenhuma musica tocando</p>
        <p class="track-artist" id="artist">YouTube Music</p>
        <div class="player-controls">
          <button id="previous" class="control" title="Anterior">
            <img src="../../../assets/icons/prev.svg" alt="Anterior">
          </button>
          <button id="play-pause" class="control play" title="Play/Pause">
            <img src="../../../assets/icons/play.svg" alt="Play">
          </button>
          <button id="next" class="control" title="Proxima">
            <img src="../../../assets/icons/next.svg" alt="Proxima">
          </button>
        </div>
      </div>
    </div>

    <section class="progress-section">
      <input id="progress" type="range" min="0" max="100" value="0">
      <div class="time-row">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </section>

    <footer class="footer-controls">
      <div class="footer-left">
        <button id="like" class="footer-button" title="Curtir">
          <img src="../../../assets/icons/like.svg" alt="Curtir">
        </button>
        <button id="repeat" class="footer-button" title="Repetir">
          <img src="../../../assets/icons/repeat-off.svg" alt="Repetir">
        </button>
      </div>
      <div class="footer-right">
        <button id="shuffle" class="footer-button" title="Aleatorio">
          <img src="../../../assets/icons/shuffle.svg" alt="Aleatorio">
        </button>
        <button id="settings" class="footer-button" title="Configuracoes">
          <img src="../../../assets/icons/gear.svg" alt="Config">
        </button>
      </div>
    </footer>

    <div id="settings-backdrop" class="settings-backdrop hidden"></div>

    <div id="settings-menu" class="settings-menu hidden" role="menu">
      <div class="settings-header">Ajustes</div>
      
      <label class="settings-row">
        <div class="settings-row-left">
          <img src="../../../assets/icons/pin.svg" alt="">
          <span>Sempre no topo</span>
        </div>
        <div class="toggle-switch">
          <input id="always-on-top" type="checkbox">
          <span class="toggle-slider"></span>
        </div>
      </label>

      <label class="settings-row">
        <div class="settings-row-left">
          <img src="../../../assets/icons/startup.svg" alt="">
          <span>Iniciar com Windows</span>
        </div>
        <div class="toggle-switch">
          <input id="start-with-windows" type="checkbox">
          <span class="toggle-slider"></span>
        </div>
      </label>

      <label class="settings-row">
        <div class="settings-row-left">
          <img src="../../../assets/icons/minimize-tray.svg" alt="">
          <span>Minimizar ao fechar</span>
        </div>
        <div class="toggle-switch">
          <input id="close-to-tray" type="checkbox">
          <span class="toggle-slider"></span>
        </div>
      </label>

      <div class="settings-separator"></div>

      <button id="open-full-player" class="settings-action-button">
        <div class="settings-row-left">
          <img src="../../../assets/icons/expand.svg" alt="">
          <span>Abrir YouTube Music</span>
        </div>
        <div class="settings-action-arrow">
          <img src="../../../assets/icons/chevron-right.svg" alt="">
        </div>
      </button>

      <div class="settings-separator"></div>

      <button id="exit-app" class="exit-option">
        <img src="../../../assets/icons/exit.svg" alt="">
        <span>Fechar aplicativo</span>
      </button>
    </div>

  </main>
  <script src="./miniPlayer.js"></script>
</body>
</html>
