<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Music Mini Player</title>
  <link rel="stylesheet" href="./miniPlayer.css">
</head>
<body>
  <main class="mini-player" aria-label="Mini player do YouTube Music">
    <header class="window-actions">
      <button id="account-button" class="icon-button" title="Gerenciar contas" aria-label="Gerenciar contas"><img src="../../../assets/icons/avatar.png" alt="Conta"></button>
      <button id="close-button" class="icon-button close" title="Fechar" aria-label="Fechar">×</button>
    </header>
    <section class="track-section">
      <img id="cover" class="cover" alt="Capa da música" src="../../../assets/icon.png">
      <div class="track-meta"><h1 id="title">Nenhuma música tocando</h1><p id="artist">YouTube Music</p></div>
    </section>
    <section class="player-controls">
      <button id="previous" class="control" title="Música anterior" aria-label="Música anterior"><img src="../../../assets/icons/previous.png" alt="Anterior"></button>
      <button id="play-pause" class="control play" title="Reproduzir ou pausar" aria-label="Reproduzir ou pausar"><img src="../../../assets/icons/play.png" alt="Reproduzir"></button>
      <button id="next" class="control" title="Próxima música" aria-label="Próxima música"><img src="../../../assets/icons/next.png" alt="Próxima"></button>
    </section>
    <section class="progress-section">
      <input id="progress" type="range" min="0" max="100" value="0" aria-label="Progresso da música">
      <div class="time"><span id="current-time">0:00</span><span id="duration">0:00</span></div>
    </section>
    <footer class="footer-controls">
      <button id="like" class="footer-button" title="Curtir" aria-label="Curtir"><img src="../../../assets/icons/like.png" alt="Curtir"></button>
      <button id="repeat" class="footer-button" title="Repetir" aria-label="Repetir"><img src="../../../assets/icons/repeat.png" alt="Repetir"></button>
      <span class="spacer"></span>
      <button id="shuffle" class="footer-button" title="Aleatório" aria-label="Aleatório"><img src="../../../assets/icons/shuffle.png" alt="Aleatório"></button>
      <button id="settings" class="footer-button" title="Opções" aria-label="Opções"><img src="../../../assets/icons/settings.png" alt="Opções"></button>
    </footer>
    <div id="settings-menu" class="settings-menu hidden" role="menu">
      <label><input id="start-with-windows" type="checkbox"> Iniciar com o Windows</label>
      <label><input id="close-to-tray" type="checkbox"> Manter aberto ao clicar no X</label>
      <label><input id="always-on-top" type="checkbox"> Manter sempre no topo</label>
      <button id="exit-app" class="exit-option">Fechar aplicativo completamente</button>
    </div>
  </main>
  <script src="./miniPlayer.js"></script>
</body>
</html>
